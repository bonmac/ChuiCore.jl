# ChuiCore performance budgets (ADR-0009). Budgets may only tighten without an ADR amendment.
#
# [ttfx.<julia major.minor>]: warm medians of fresh processes, checked by
#   julia benchmark/ttfx.jl --check            (milliseconds)
# [time.<julia major.minor>]: median time of each SUITE entry of benchmark/benchmarks.jl, checked by
#   julia benchmark/run.jl --check             (nanoseconds)
# Versions without a table of their own use `default` (ttfx) or "1.10" (time).
# Each time budget is 3x that version's median at main b4f1ca3 (Apple M3 Pro, load average 8-17),
# rounded up to 1-2-5 (so 3x to 7.5x), with a 10 ns floor for call-overhead entries. The comment
# after each row is that baseline in ns. Allocation budgets are tests: test/perf_allocs_tests.jl.


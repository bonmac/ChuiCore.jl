# The clash-list environment (ADR-0005 §2): the packages whose exports ChuiCore's exports must not
# shadow. Not part of test/Project.toml: the `:quality` item "ADR-0005 clash list" copies this file
# to a scratch directory and runs step 2 of check.jl there, so this file is never rewritten.
# ChuiCore itself is NOT in this environment: TypeClasses 1.x needs Compat ≤ 3 (step 1 runs in
# chuicore/). Extending the list needs an ADR.
